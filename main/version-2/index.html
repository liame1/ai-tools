<body>
<div class="status-screen">
  <div class="big">Loading directory…</div>
  <p>Fetching tools.csv</p>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   EDITING THIS DIRECTORY
   ────────────────────────────────────────────────────────────────
   All tool listings live in tools.csv, next to this file. Columns:

     id           unique slug, e.g. "perplexity-ai"
     category     top-level grouping (e.g. "Research & Discovery")
     subcategory  second-level grouping under a category
     name         tool's display name
     tagline      short one-line description (Type/Tagline)
     description  full paragraph description
     notes        availability / transparency notes (optional).
                  Any note containing "SJSU" gets a highlighted
                  "SJSU-provided access" badge on the card.
     domain       website domain for the link + favicon, e.g.
                  "perplexity.ai" (no https://, no trailing slash)
     logo         optional direct image URL to override the
                  auto-favicon. Leave blank to auto-detect.

   Add a row = add a tool. Change "category"/"subcategory" text to
   regroup tools — new group names just appear automatically, no
   code changes needed. Category display order follows the order
   categories first appear in the file, top to bottom.

   IMPORTANT: this page loads tools.csv with fetch(), so it must be
   served over http(s) — GitHub Pages, or a local server (VS Code's
   "Live Server" extension, `npx serve`, etc). Opening this file
   directly by double-clicking it (a file:// address) will not work;
   browsers block local pages from fetching sibling files.
   ════════════════════════════════════════════════════════════════ */

/* ── CSV parser (handles quoted fields, commas, "" escapes) ── */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (rows.length && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') rows.pop();
  const header = rows.shift().map(h => h.trim());
  return rows.map(r => {
    const obj = {};
    header.forEach((h, i) => obj[h] = (r[i] ?? '').trim());
    return obj;
  });
}

function parseToolsCSV(text) {
  return parseCSV(text).map(r => ({
    id: r.id, category: r.category, subcategory: r.subcategory, name: r.name,
    tagline: r.tagline, description: r.description, notes: r.notes,
    domain: r.domain, logo: r.logo
  }));
}

/* ── Group tools into Category -> Subcategory -> [tools], preserving first-seen order ── */
function groupTools(tools) {
  const cats = [];
  const catMap = {};
  tools.forEach(t => {
    if (!catMap[t.category]) {
      const entry = { name: t.category, subs: [], subMap: {} };
      catMap[t.category] = entry;
      cats.push(entry);
    }
    const cat = catMap[t.category];
    if (!cat.subMap[t.subcategory]) {
      const sub = { name: t.subcategory, tools: [] };
      cat.subMap[t.subcategory] = sub;
      cat.subs.push(sub);
    }
    cat.subMap[t.subcategory].tools.push(t);
  });
  return cats;
}

const MONO_COLORS = ['#0055A2','#B9840F','#2E7D63','#7A3E9D','#B04A3C','#1E6E8C'];
function monoColor(i) { return MONO_COLORS[i % MONO_COLORS.length]; }

function slugId(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function esc(str) {
  return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function cardHTML(t, i) {
  let logoHTML;
  if (t.logo) {
    logoHTML = `<img class="logo" src="${esc(t.logo)}" alt="" loading="lazy"
      onerror="this.outerHTML='<div class=&quot;mono&quot; style=&quot;background:${monoColor(i)}&quot;>${esc(t.name[0])}</div>'">`;
  } else if (t.domain) {
    logoHTML = `<img class="logo" src="https://www.google.com/s2/favicons?domain=${esc(t.domain)}&sz=64" alt="" loading="lazy"
      onerror="this.outerHTML='<div class=&quot;mono&quot; style=&quot;background:${monoColor(i)}&quot;>${esc(t.name[0])}</div>'">`;
  } else {
    logoHTML = `<div class="mono" style="background:${monoColor(i)}">${esc(t.name[0])}</div>`;
  }

  const nameInner = `${esc(t.name)}${t.domain ? '<span class="arrow">↗</span>' : ''}`;
  const nameHTML = t.domain
    ? `<a class="card-name" href="https://${esc(t.domain)}" target="_blank" rel="noopener">${nameInner}</a>`
    : `<span class="card-name">${nameInner}</span>`;

  const badge = /sjsu/i.test(t.notes || '')
    ? `<div class="card-badge">✓ SJSU-provided access</div>` : '';
  const noteHTML = t.notes
    ? `<div class="card-note">${esc(t.notes)}</div>` : '';

  const searchBlob = esc([t.name, t.tagline, t.description, t.category, t.subcategory].join(' ')).toLowerCase();

  return `
    <div class="card" data-search="${searchBlob}">
      <div class="card-top">
        ${logoHTML}
        <div class="card-name-wrap">
          ${nameHTML}
          <div class="card-tagline">${esc(t.tagline)}</div>
        </div>
      </div>
      <div class="card-desc">${esc(t.description)}</div>
      ${badge}
      ${noteHTML}
    </div>`;
}

/* One-sentence framing per category, written to orient the reader
   (edit here if you want different intro copy — this isn't in the CSV
   since it describes the group, not an individual tool). */
const CATEGORY_INTROS = {
  'Research & Discovery': 'Search engines, citation mappers, and reference tools that help you find and make sense of scholarly literature.',
  'Video Production & Editing': 'Tools for generating, narrating, and editing video — from cinematic clips to transcript-based editing.',
  'Visual Design & Presentation': 'Image generators and presentation builders that turn a prompt or outline into finished visuals.',
  'Music & Sound Creation': 'AI composers and song generators that produce original music and royalty-free soundtracks from a text prompt.',
};

function buildPage() {
  document.body.innerHTML = `
    <header class="masthead">
      <div class="masthead-inner">
        <div class="eyebrow"><span class="dot"></span>San José State University · Library</div>
        <h1 class="title">AI Tools Directory</h1>
        <p class="subtitle">A browsable guide to generative AI tools for research, video, design, and music — curated by the SJSU Library for students, faculty, and staff.</p>
        <div class="search-row">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="searchInput" type="text" placeholder="Search by tool name, task, or keyword…" autocomplete="off">
          </div>
          <div class="result-count" id="resultCount"></div>
        </div>
      </div>
    </header>
    <nav class="catnav-wrap"><div class="catnav" id="catNav"></div></nav>
    <main class="content" id="content"></main>
    <div class="empty-state" id="emptyState">
      <div class="big">No tools match "<span id="emptyQuery"></span>"</div>
      <div>Try a different search term, or clear the search box.</div>
    </div>
    <footer class="footer">
      <div><b>SJSU AI Tools Directory</b> — data lives entirely in <code>tools.csv</code>, editable without touching this page.</div>
      <div id="footerCount"></div>
    </footer>`;
}

function render(tools) {
  const groups = groupTools(tools);
  const content = document.getElementById('content');
  const catNav = document.getElementById('catNav');

  catNav.innerHTML = groups.map((cat, i) => {
    const id = slugId(cat.name);
    const count = cat.subs.reduce((n, s) => n + s.tools.length, 0);
    return `<button data-target="cat-${id}" class="${i === 0 ? 'active' : ''}">${esc(cat.name)} <span class="count">${count}</span></button>`;
  }).join('');

  content.innerHTML = groups.map(cat => {
    const id = slugId(cat.name);
    const count = cat.subs.reduce((n, s) => n + s.tools.length, 0);
    const intro = CATEGORY_INTROS[cat.name] || '';
    return `
      <section class="category-section" id="cat-${id}">
        <div class="category-head">
          <div>
            <h2>${esc(cat.name)}</h2>
            ${intro ? `<div class="cat-meta">${esc(intro)}</div>` : ''}
          </div>
          <div class="cat-count">${count} tool${count === 1 ? '' : 's'}</div>
        </div>
        ${cat.subs.map(sub => `
          <div class="subcategory" data-sub="${slugId(sub.name)}">
            <h3>${esc(sub.name)}</h3>
            <div class="card-grid">
              ${sub.tools.map((t, i) => cardHTML(t, i)).join('')}
            </div>
          </div>
        `).join('')}
      </section>`;
  }).join('');

  document.getElementById('footerCount').textContent = tools.length + ' tools across ' + groups.length + ' categories';

  wireNav();
  wireSearch();
}

/* ── Category nav: click to scroll, IntersectionObserver to highlight active ── */
function wireNav() {
  const buttons = [...document.querySelectorAll('#catNav button')];
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(btn.dataset.target).scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  const sections = [...document.querySelectorAll('.category-section')];
  if (!sections.length) return;
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id;
        buttons.forEach(b => b.classList.toggle('active', b.dataset.target === id));
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });
  sections.forEach(s => obs.observe(s));
}

/* ── Live search across name / tagline / description / category / subcategory ── */
function wireSearch() {
  const input = document.getElementById('searchInput');
  const resultCount = document.getElementById('resultCount');
  const emptyState = document.getElementById('emptyState');
  const emptyQuery = document.getElementById('emptyQuery');
  const allCards = [...document.querySelectorAll('.card')];
  const allSubs = [...document.querySelectorAll('.subcategory')];
  const allCats = [...document.querySelectorAll('.category-section')];
  const total = allCards.length;

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) {
      allCards.forEach(c => c.classList.remove('hidden'));
      allSubs.forEach(s => s.classList.remove('hidden'));
      allCats.forEach(c => c.classList.remove('hidden'));
      emptyState.classList.remove('show');
      resultCount.textContent = '';
      return;
    }
    let visible = 0;
    allCards.forEach(c => {
      const match = c.dataset.search.includes(q);
      c.classList.toggle('hidden', !match);
      if (match) visible++;
    });
    allSubs.forEach(sub => {
      const anyVisible = [...sub.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      sub.classList.toggle('hidden', !anyVisible);
    });
    allCats.forEach(cat => {
      const anyVisible = [...cat.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      cat.classList.toggle('hidden', !anyVisible);
    });
    resultCount.textContent = visible + ' of ' + total + ' tools';
    emptyQuery.textContent = input.value.trim();
    emptyState.classList.toggle('show', visible === 0);
  });
}

/* ── Init: load tools.csv, then build + render the page ── */
async function init() {
  try {
    const res = await fetch('tools.csv');
    if (!res.ok) throw new Error('tools.csv failed to load (HTTP ' + res.status + ')');
    const text = await res.text();
    const tools = parseToolsCSV(text);
    if (!tools.length) throw new Error('tools.csv loaded but contained no rows');

    buildPage();
    render(tools);
  } catch (err) {
    console.error('SJSU AI Tools Directory failed to load data:', err);
    document.body.innerHTML = `
      <div class="status-screen">
        <div class="big">Couldn't load the directory</div>
        <p>${esc(err.message)}</p>
        <p style="margin-top:14px;">
          Make sure <code>tools.csv</code> is in the same folder as this page, and that you're
          viewing it over <strong>http(s)</strong> — via GitHub Pages, or a local server such as
          VS Code's "Live Server" extension or <code>npx serve</code>. Opening this file directly
          by double-clicking it (a <code>file://</code> address) blocks the browser from fetching
          the CSV, even if it's right next to it.
        </p>
      </div>`;
  }
}
init();
</script>
</body>
</html>
